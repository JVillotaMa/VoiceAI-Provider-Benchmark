[project]
name = "voicebench"
version = "0.1.0"
description = "Open, reproducible latency benchmark for voice AI agent platforms (Vapi, Retell, Pipecat, LiveKit), measured from Europe"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
authors = [{ name = "Jaime Villota", email = "jvillotama@gmail.com" }]
dependencies = [
    "fastapi>=0.141,<1",
    "loguru>=0.7.3",
    # Upper bound is deliberate. Pipecat moved processor names and parameters between 0.0.x and
    # 1.x, and its params objects are Pydantic models that drop unknown fields silently — a major
    # bump would reconfigure the instrument without failing. See
    # openspec/changes/add-caller-agent/design.md, decision 6.
    # The `websocket` extra is the Twilio Media Streams transport; it brings fastapi with it.
    "pipecat-ai[cartesia,deepgram,openai,silero,websocket]>=1.7.0,<2",
    "python-dotenv>=1.2.3",
    "twilio>=9.11.0,<10",
    "uvicorn>=0.52.4,<1",
]

[dependency-groups]
dev = [
    "ruff>=0.13",
    "mypy>=1.18",
    "deptry>=0.23",
    "pytest>=8.4",
    "pre-commit>=4.3",
    "commitizen>=4.9",
]

[project.scripts]
voicebench-api = "voicebench.api:main"

[build-system]
requires = ["uv_build>=0.9.21,<0.10.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes (F401 = unused imports)
    "I",        # isort
    "UP",       # pyupgrade
    "B",        # bugbear
    "SIM",      # simplify
    "RUF",      # ruff-specific
]

[tool.mypy]
python_version = "3.12"
files = ["src", "tests"]
strict = false
warn_unused_ignores = true
warn_redundant_casts = true
warn_unreachable = true
disallow_untyped_defs = true
ignore_missing_imports = true

[tool.deptry]
known_first_party = ["voicebench"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.commitizen]
name = "cz_conventional_commits"
version_provider = "pep621"
tag_format = "v$version"
update_changelog_on_bump = true
